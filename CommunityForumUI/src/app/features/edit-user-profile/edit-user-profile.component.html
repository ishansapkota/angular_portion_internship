<div class="container">
  <div style="display:flex;width:100%;">
      <form #form="ngForm" (ngSubmit)="onUpdate()"> 
          <div style="width:100%;">
              <p>First Name</p>
              <input type = "text" name="fname" autofocus [(ngModel)]="user.firstname" >
          </div>

          <div style="width:100%;">
            <p>Last Name</p>
            <input type = "text" name="lname" autofocus [(ngModel)]="user.lastname" >
        </div>

          <div style="width:100%;">
              <p>Email Address</p>
              <input type = "text" name="email" autofocus [(ngModel)]="user.email" >
          </div>

          <div style="width:100%;">
            <p>Address</p>
            <input type = "text" name="address" autofocus [(ngModel)]="user.address" >
        </div>

        <div style="width:100%;">
          <p>Date of Birth</p>
          <input type = "date" name="dob" autofocus [(ngModel)]="user.dob" >
      </div>

          <button type="submit" class="btn btn-primary">UPDATE</button>
              <a class="btn btn-secondary" [routerLink]="['/user-profile']" style="color: white;">Go Back</a>
      </form> 
  </div>
</div>
